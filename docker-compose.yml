services:

  drupal:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: drupal_app

    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html

    depends_on:
      db:
        condition: service_healthy

    environment:
      COMPOSER_MEMORY_LIMIT: -1


  db:
    image: mariadb:11.4

    container_name: drupal_db

    ports:
      - "3307:3306"

    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupal
      MARIADB_ROOT_PASSWORD: root

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  db_data: