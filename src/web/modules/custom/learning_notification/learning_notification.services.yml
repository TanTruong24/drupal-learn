services:
    logger.channel.learning_notification:
        parent: logger.channel_base
        arguments:
            - 'learning_notification'

    learning_notification.booking_event_subscriber:
        class: Drupal\learning_notification\EventSubscriber\BookingEventSubscriber
        arguments:
            - '@logger.channel.learning_notification'
            - '@learning_notification.notification'
        tags:
            - { name: event_subscriber }

    learning_notification.notification:
        class: Drupal\learning_notification\Service\BookingNotificationService
        arguments:
            - '@plugin.manager.mail'
            - '@language_manager'
            - '@logger.channel.learning_notification'
